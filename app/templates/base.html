<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Outpost{% endblock %}</title>

    <!-- Apply saved/preferred theme before paint to avoid a flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("outpost-theme");
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (saved === "dark" || (!saved && prefersDark)) {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {}
      })();
    </script>

    <link rel="stylesheet" href="/static/css/tokens.css" />
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body>
    <div class="app">
      <aside class="rail">
        <div class="rail__brand">
          <span class="rail__mark" aria-hidden="true"></span>
          Outpost
        </div>

        {% if workspace %}
        <div class="workspace-switcher">
          <form method="post" action="/workspaces/switch" class="workspace-switcher__form">
            <select name="workspace_id" class="select" onchange="this.form.submit()">
              {% for w in workspaces %}
              <option value="{{ w.id }}" {% if w.id == workspace.id %}selected{% endif %}>{{ w.name }}</option>
              {% endfor %}
            </select>
          </form>
          <a class="workspace-switcher__new" href="/workspaces/new">+ New workspace</a>
        </div>
        {% endif %}

        <nav class="rail__nav">
          <a class="rail__item {% if request.url.path == '/' %}rail__item--active{% endif %}" href="/">Home</a>
          {% if workspace %}
          <a class="rail__item {% if request.url.path == '/settings' %}rail__item--active{% endif %}" href="/settings">Settings</a>
          {% endif %}
        </nav>
      </aside>

      <div class="main">
        <header class="topbar">
          <span class="topbar__title">{% block topbar %}Home{% endblock %}</span>
          <button id="theme-toggle" class="btn btn--secondary" type="button">
            ◐ Dark
          </button>
        </header>

        <main class="content">{% block content %}{% endblock %}</main>
      </div>
    </div>

    <script src="/static/js/theme.js"></script>
  </body>
</html>
